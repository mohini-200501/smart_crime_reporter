{% load static %}

<header class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/95 text-white shadow-lg backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-col gap-3 px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
        <a href="{% url 'home' %}" class="flex items-center gap-3 self-center sm:self-auto">
            <img
                src="{% static 'images/smart-crime-reporting-logo.png' %}"
                alt="Smart Crime Reporting"
                class="h-10 w-16 shrink-0 rounded-lg object-cover"
                width="64"
                height="40"
            >
            <span>
                <span class="block text-sm font-bold tracking-wide sm:text-base">AI Crime Report Analyzer With Similar Cases Finder</span>
                <span class="mt-0.5 block text-[10px] font-semibold uppercase tracking-[0.2em] text-slate-400">Crime intelligence workspace</span>
            </span>
        </a>

        <nav aria-label="Primary navigation" class="flex items-center justify-center gap-1 text-sm sm:justify-end">
            <a href="{% url 'home' %}" class="rounded-lg px-3 py-2 font-medium text-slate-200 transition hover:bg-white/10 hover:text-white">
                Home
            </a>
            <a href="{% url 'reports' %}" class="rounded-lg px-3 py-2 font-medium text-slate-300 transition hover:bg-white/10 hover:text-white">
                Reports
            </a>
            <a href="#" class="rounded-lg px-3 py-2 font-medium text-slate-300 transition hover:bg-white/10 hover:text-white">
                Cases
            </a>
            <a href="#" class="rounded-lg px-3 py-2 font-medium text-slate-300 transition hover:bg-white/10 hover:text-white">
                About
            </a>
        </nav>
    </div>
</header>
